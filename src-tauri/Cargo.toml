[package]
name = "vorax-decision-assistant"
version = "0.1.0"
description = "Torchlight Infinite Vorax decision assistant"
authors = ["DARKMAN0216"]
license = "MIT"
repository = "https://github.com/DARKMAN0216/Torchlight"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vorax_decision_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
